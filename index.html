<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I eat the polar bears and drink water, oh, zach, guess what, you doxxed a minor, wait till NTTS hears about this.</title>
    <!-- Loading Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000;
            font-family: 'Inter', sans-serif;
        }
        .iframe-container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>
<body class="bg-black text-white flex flex-col h-screen select-none m-0 p-0 overflow-hidden">

    <div id="appContainer" class="iframe-container w-full h-full relative">
        <!-- Added allow="fullscreen" and allowfullscreen to satisfy permissions policy -->
        <iframe 
            id="obsIframe"
            src="http://78.154.103.18:13062/obs_view"
        >
        </iframe>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('appContainer');

            // Function to trigger full-screen mode on the container
            const triggerFullscreen = () => {
                if (!document.fullscreenElement) {
                    container.requestFullscreen().catch(err => {
                        console.warn("Fullscreen request blocked or not allowed:", err.message);
                    });
                }
            };

            // Attempt auto-fullscreen immediately
            triggerFullscreen();

            // Fallback: Trigger fullscreen on the very first user interaction anywhere on the page
            const handleFirstInteraction = () => {
                triggerFullscreen();
                window.removeEventListener('click', handleFirstInteraction);
                window.removeEventListener('touchstart', handleFirstInteraction);
                window.removeEventListener('keydown', handleFirstInteraction);
            };

            window.addEventListener('click', handleFirstInteraction);
            window.addEventListener('touchstart', handleFirstInteraction);
            window.addEventListener('keydown', handleFirstInteraction);
        });
    </script>
</body>
</html>
